<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sinh viên</title>

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- AdminLTE -->
    <link
        rel="stylesheet"
        href="/AdminLTE-4.9.1/dist/css/adminlte.css">
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

    <!-- ================= HEADER ================= -->
    <nav class="app-header navbar navbar-expand bg-body">

        <div class="container-fluid">

            <!-- Menu button -->
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-lte-toggle="sidebar" href="#">
                        <i class="bi bi-list"></i>
                    </a>
                </li>
            </ul>

            <!-- Right -->
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-bell"></i>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-person-circle"></i>
                        Admin
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- ================= SIDEBAR ================= -->

    <aside class="app-sidebar bg-dark shadow" data-bs-theme="dark">

        <!-- Logo -->
        <div class="sidebar-brand">

            <a href="student.html" class="brand-link">

                <span class="brand-text fw-light">
                    University Training
                </span>

            </a>

        </div>


        <!-- Sidebar -->
        <div class="sidebar-wrapper">

            <nav class="mt-2">

                <ul
                    class="nav sidebar-menu flex-column"
                    data-lte-toggle="treeview"
                    role="menu">

                    <!-- Sinh viên -->
                    <li class="nav-item">

                        <a href="student.html"
                           class="nav-link active">

                            <i class="nav-icon bi bi-people"></i>

                            <p>
                                Sinh viên
                            </p>

                        </a>

                    </li>


                    <!-- Học phần -->
                    <li class="nav-item">

                        <a href="#" class="nav-link">

                            <i class="nav-icon bi bi-book"></i>

                            <p>
                                Học phần
                            </p>

                        </a>

                    </li>


                    <!-- Phòng học -->
                    <li class="nav-item">

                        <a href="#" class="nav-link">

                            <i class="nav-icon bi bi-building"></i>

                            <p>
                                Phòng học
                            </p>

                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="app-main">


        <!-- Content Header -->

        <div class="app-content-header">

            <div class="container-fluid">

                <div class="row">

                    <div class="col-sm-6">

                        <h3 class="mb-0">
                            Quản lý sinh viên
                        </h3>

                    </div>


                    <div class="col-sm-6">

                        <ol class="breadcrumb float-sm-end">

                            <li class="breadcrumb-item">
                                <a href="#">Home</a>
                            </li>

                            <li class="breadcrumb-item active">
                                Sinh viên
                            </li>

                        </ol>

                    </div>

                </div>

            </div>

        </div>


        <!-- Content -->

        <div class="app-content">

            <div class="container-fluid">


                <!-- CARD -->

                <div class="card">


                    <!-- Card header -->

                    <div class="card-header">

                        <div class="d-flex justify-content-between align-items-center">

                            <h3 class="card-title">

                                <i class="bi bi-people me-2"></i>

                                Danh sách sinh viên

                            </h3>


                            <button
                                class="btn btn-primary"
                                onclick="openAddModal()">

                                <i class="bi bi-plus-circle"></i>

                                Thêm sinh viên

                            </button>

                        </div>

                    </div>


                    <!-- Search -->

                    <div class="card-body border-bottom">

                        <div class="row">

                            <div class="col-md-6">

                                <div class="input-group">

                                    <input
                                        type="text"
                                        id="searchKeyword"
                                        class="form-control"
                                        placeholder="Tìm mã SV, họ tên, email...">

                                    <button
                                        class="btn btn-primary"
                                        onclick="searchStudents()">

                                        <i class="bi bi-search"></i>

                                        Tìm kiếm

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- TABLE -->

                    <div class="card-body p-0">

                        <div class="table-responsive">

                            <table class="table table-hover align-middle mb-0">

                                <thead class="table-light">

                                <tr>

                                    <th style="width: 5%;">
                                        STT
                                    </th>

                                    <th>
                                        Mã sinh viên
                                    </th>

                                    <th>
                                        Họ và tên
                                    </th>

                                    <th>
                                        Email
                                    </th>

                                    <th>
                                        Số điện thoại
                                    </th>

                                    <th>
                                        Lớp
                                    </th>

                                    <th
                                        class="text-center"
                                        style="width: 150px;">

                                        Thao tác

                                    </th>

                                </tr>

                                </thead>


                                <tbody id="studentTableBody">

                                <tr>

                                    <td
                                        colspan="7"
                                        class="text-center py-4">

                                        <div class="spinner-border text-primary">
                                        </div>

                                        <div class="mt-2">
                                            Đang tải dữ liệu...
                                        </div>

                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="app-footer">

        <div class="float-end d-none d-sm-inline">
            Student Management
        </div>

        <strong>
            Copyright &copy; 2026
        </strong>

    </footer>

</div>


<!-- ================= MODAL ================= -->

<div
    class="modal fade"
    id="studentModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle">

                    Thêm sinh viên

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <input
                    type="hidden"
                    id="studentId">


                <div class="mb-3">

                    <label class="form-label">
                        Mã sinh viên
                    </label>

                    <input
                        type="text"
                        id="studentCode"
                        class="form-control"
                        placeholder="SV011">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Họ và tên
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        class="form-control"
                        placeholder="Nguyễn Văn A">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="email@gmail.com">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Số điện thoại
                    </label>

                    <input
                        type="text"
                        id="phone"
                        class="form-control"
                        placeholder="0901234567">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Lớp
                    </label>

                    <input
                        type="text"
                        id="className"
                        class="form-control"
                        placeholder="C2024A">

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Đóng

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="saveStudent()">

                    <i class="bi bi-save"></i>

                    Lưu

                </button>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- AdminLTE -->
<script
    src="/AdminLTE-4.9.1/dist/js/adminlte.js">
</script>


<!-- Student JS -->
<script src="/assets/js/student.js"></script>


</body>

</html>
